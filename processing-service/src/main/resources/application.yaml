server:
  port: 8081

spring:
  application:
    name: processing-service

aws:
  region: ap-south-1

  sqs:
    queue-url: ${SQS_QUEUE_URL}

  s3:
    bucket-name: ${S3_BUCKET_NAME}

processing:
  batch:
    size: 10
    interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.eventplatform: DEBUG